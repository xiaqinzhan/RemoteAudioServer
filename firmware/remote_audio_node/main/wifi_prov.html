<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>设备配网 · remote-audio-node</title>
<style>
  :root{
    --bg:#0f1720; --card:#18222e; --line:#26333f; --fg:#e8eef5; --dim:#8fa3b6;
    --accent:#37c98b; --warn:#f0a03c; --err:#f2685f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:16px 14px 28px;background:var(--bg);color:var(--fg);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  h1{font-size:19px;margin:4px 0 2px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0}
  .row span:first-child{color:var(--dim)}
  .tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;
       background:rgba(55,201,139,.14);color:var(--accent);border:1px solid rgba(55,201,139,.35)}
  label{display:block;font-size:13px;color:var(--dim);margin:10px 0 5px}
  input{width:100%;padding:11px 12px;font-size:16px;border-radius:9px;
        border:1px solid var(--line);background:#111a24;color:var(--fg)}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;padding:13px;font-size:16px;font-weight:600;border-radius:10px;border:0;
         background:var(--accent);color:#06231a;margin-top:14px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);font-weight:500;margin-top:8px}
  button:disabled{opacity:.5}
  ul{list-style:none;margin:8px 0 0;padding:0;max-height:236px;overflow:auto}
  li{padding:10px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;
     display:flex;justify-content:space-between;align-items:center;font-size:14px}
  li:active{background:#1d2a37}
  li b{font-weight:600}
  li small{color:var(--dim);font-weight:400}
  .msg{margin-top:12px;font-size:13.5px;padding:10px 11px;border-radius:9px;display:none;white-space:pre-wrap}
  .msg.ok{display:block;background:rgba(55,201,139,.12);border:1px solid rgba(55,201,139,.35);color:#a8ecc9}
  .msg.err{display:block;background:rgba(242,104,95,.12);border:1px solid rgba(242,104,95,.35);color:#ffc9c5}
  .msg.info{display:block;background:rgba(240,160,60,.12);border:1px solid rgba(240,160,60,.35);color:#ffdda8}
  .hint{color:var(--dim);font-size:12.5px;line-height:1.65}
  .spin{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px;
        border:2px solid rgba(255,255,255,.28);border-top-color:var(--accent);border-radius:50%;
        animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<h1>设备配网</h1>
<div class="sub">remote-audio-node · ESP32-S3 音频采集节点</div>

<div class="card">
  <div class="row"><span>设备状态</span><span id="st">读取中…</span></div>
  <div class="row"><span>本机热点</span><span id="ap">-</span></div>
  <div class="row"><span>设备 ID</span><span id="dev">-</span></div>
  <div class="row"><span>固件版本</span><span id="fw">-</span></div>
</div>

<div class="card">
  <div class="row"><span>选择要连接的网络</span><span id="scanTip"></span></div>
  <ul id="list"><li style="color:var(--dim);border-style:dashed;justify-content:center">点下面的按钮扫描附近 WiFi</li></ul>
  <button class="ghost" id="btnScan" type="button">扫描附近 WiFi</button>

  <label for="ssid">WiFi 名称（SSID）</label>
  <input id="ssid" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="也可直接手动输入">
  <label for="pass">WiFi 密码</label>
  <input id="pass" type="password" autocomplete="off" placeholder="开放网络可留空">
  <button id="btnSave" type="button">保存并连接</button>
  <div class="msg" id="msg"></div>
</div>

<div class="card hint">
  · 设备会自动记住这次填的 WiFi，下次上电直接连，不用再配。<br>
  · 只有你在这里保存新网络时，旧记录才会被覆盖；进配网模式本身不会删除任何记录。<br>
  · 如果这个名字底下连不上（密码错、路由器不在），设备会继续用热点等着你重填。<br>
  · 连接成功后热点会自动关闭，设备随即回到正常采集状态。
</div>

<script>
const $ = id => document.getElementById(id);
function show(kind, text){ const m=$('msg'); m.className='msg '+kind; m.innerHTML=text; }
function fmtRssi(r){ return (r>=-60?'信号强':(r>=-75?'信号一般':'信号弱')) + ' · ' + r + 'dBm'; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadStatus(){
  try{
    const r = await fetch('/status', {cache:'no-store'});
    const j = await r.json();
    $('st').innerHTML = j.state === 'connecting' ? '<span class="spin"></span>正在连接…'
                       : j.state === 'success' ? '<span class="tag">已连接</span>'
                       : '<span class="tag">等待设置</span>';
    $('ap').textContent  = j.ap_ssid || '-';
    $('dev').textContent = j.device_id || '-';
    $('fw').textContent  = 'v' + (j.fw || '-');
    if (j.ip) $('ap').textContent = j.ap_ssid + '（设备 IP ' + j.ip + '）';
  }catch(e){ $('st').textContent = '读取失败'; }
}

async function scan(){
  const btn = $('btnScan');
  btn.disabled = true; btn.textContent = '扫描中…'; $('scanTip').textContent = '';
  try{
    const r = await fetch('/scan', {cache:'no-store'});
    const j = await r.json();
    const ul = $('list'); ul.innerHTML = '';
    if(!j.aps || !j.aps.length){
      ul.innerHTML = '<li style="color:var(--dim);border-style:dashed;justify-content:center">没扫到网络，可手动输入名称</li>';
    }
    (j.aps||[]).forEach(a => {
      const li = document.createElement('li');
      li.innerHTML = '<b>' + esc(a.ssid) + (a.auth ? '' : ' <small>(开放)</small>') + '</b><small>' + fmtRssi(a.rssi) + '</small>';
      li.onclick = () => { $('ssid').value = a.ssid; $('pass').focus(); show('info','已选中「' + esc(a.ssid) + '」，请输入密码后保存。'); };
      ul.appendChild(li);
    });
    $('scanTip').textContent = '共 ' + ((j.aps||[]).length) + ' 个';
  }catch(e){
    $('list').innerHTML = '<li style="color:var(--err);border-style:dashed;justify-content:center">扫描失败，请重试</li>';
  }
  btn.disabled = false; btn.textContent = '重新扫描';
}

async function save(){
  const ssid = $('ssid').value.trim();
  const pass = $('pass').value;
  if(!ssid){ show('err','请先填写或选择 WiFi 名称。'); return; }
  const btn = $('btnSave');
  btn.disabled = true; btn.textContent = '连接中…';
  show('info','已提交，正在用『' + esc(ssid) + '』尝试连接，请稍候（最多约 20 秒）…');
  try{
    const r = await fetch('/save', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'ssid=' + encodeURIComponent(ssid) + '&password=' + encodeURIComponent(pass)
    });
    const j = await r.json();
    if(j.ok){
      show('ok','连接成功！设备已接入「' + esc(ssid) + '」，IP ' + esc(j.ip||'') +
                '。\n热点即将关闭，本页面稍后会打不开——这是正常的，设备已回到正常工作状态。');
      $('btnSave').textContent = '已完成';
      setTimeout(()=>{ btn.disabled=false; btn.textContent='再配一次'; }, 4000);
    }else{
      show('err','连接失败：' + esc(j.err || '未知原因') + '\n热点仍然开着，可以检查名称/密码后重试。');
      btn.disabled = false; btn.textContent = '重试连接';
    }
  }catch(e){
    show('err','请求没发出去（设备可能已经切换网络）。若设备指示灯/日志显示已连上，说明成功了。');
    btn.disabled = false; btn.textContent = '保存并连接';
  }
  loadStatus();
}

$('btnScan').onclick = scan;
$('btnSave').onclick = save;
loadStatus();
setInterval(loadStatus, 4000);
</script>
</body>
</html>
